services:
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    env_file:
      - ../../.env
    ports:
      # On force l'écoute sur l'IPv4 de l'hôte
      - '127.0.0.1:${REDIS_PORT}:6379'
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
